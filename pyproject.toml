[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onthefly-mcp"
version = "0.1.0"
description = "Workspace-local On-the-Fly MCP server for CLI capability construction workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
onthefly-mcp = "onthefly_mcp.server:main"
otf-mcp = "onthefly_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["onthefly_mcp*"]

